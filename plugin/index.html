<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="main">
    <div class="topbar">
        <button id="btn-reload" class="btn-small" title="Reset the panel to a clean start (files on disk are not touched)">⟳ Reload</button>
    </div>

    <div id="load-error-banner" class="banner banner-error banner-hidden"></div>
    <div id="font-banner" class="banner banner-hidden"></div>

    <section class="step">
        <h2>1. Inputs</h2>
        <div class="picker">
            <button id="btn-excel">Select Excel File…</button>
            <span id="excel-path" class="path-label">No file selected</span>
        </div>
        <div class="picker">
            <button id="btn-photos">Select Photos Folder…</button>
            <span id="photos-path" class="path-label">No folder selected</span>
        </div>
        <div class="picker">
            <button id="btn-output">Select Output Folder…</button>
            <span id="output-path" class="path-label">No folder selected</span>
        </div>
        <!-- Optional: Auto Text Color uses only the swatches selected here. -->
        <div class="picker">
            <button id="btn-palette">Select Color Palette…</button>
            <span id="palette-path" class="path-label">Optional — template text colours are kept</span>
        </div>
        <div id="palette-swatches" class="swatch-row"></div>
    </section>
    <section class="step">
        <h2>2. Template</h2>
        <button id="btn-dm-prepare" disabled>Prepare Copy of Current Document</button>
        <div class="path-line"><span class="path-caption">Template Set:</span> <span id="template-list" class="path-label">None yet — open the client template and prepare it</span></div>
        <div id="dm-summary" class="summary"></div>
    </section>
    <section class="step step-last">
        <h2>3. Match, Generate &amp; Review</h2>
        <div class="actions">
            <button id="btn-match" disabled>Match</button>
            <button id="btn-generate" disabled>Generate All .indd</button>
        </div>
        <!-- Step 3 progress: only while Generate / Regenerate / Commit runs. -->
        <div id="gen-progress" class="progress-hidden">
            <div id="gen-progress-label" class="progress-label"></div>
            <div class="progress-bar"><div id="gen-progress-fill" class="progress-fill"></div></div>
        </div>
        <div id="gen-message" class="run-message"></div>
        <div id="match-summary" class="summary"></div>
        <!-- One compact block per product; the list scrolls on its own. -->
        <div id="results" class="product-list"></div>
    </section>
    </div>

    <!-- Always visible, outside every scroll area: the current product, the
         step 3 batch actions and step 4 Export. -->
    <div id="footer-bar">
        <!-- The product INDD that is InDesign's front document. -->
        <div id="active-product" class="current-product hidden">
            <div class="current-head"><span class="current-caption">Current product</span><span id="active-name" class="current-name"></span></div>
            <div id="active-status" class="current-status"></div>
            <div id="active-actions" class="current-actions"></div>
        </div>
        <div class="batch-bar">
            <span id="status-counts" class="status-counts"></span>
            <div class="batch-buttons">
                <button id="btn-extend-all" disabled title="Extend every product whose image doesn't cover its frame (one Firefly generation per product)">Extend All Images</button>
                <button id="btn-commit-all" disabled>Commit All Ready .indd</button>
            </div>
        </div>
        <div class="export-row">
            <h2>4. Export</h2>
            <button id="btn-export" disabled>Export All Committed Images</button>
        </div>
        <!-- Export progress: only while exporting / previewing. -->
        <div id="progress" class="progress-hidden">
            <div id="progress-label" class="progress-label"></div>
            <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        </div>
        <div id="export-message" class="run-message"></div>
    </div>

    <!-- Modal TEMPLATE: the ⋯ More menu, confirmations, Image extension.
         showDialog() shows a fresh copy each time (never this element). -->
    <dialog id="action-dialog">
        <form method="dialog" class="dialog-body">
            <h3 class="dialog-title"></h3>
            <p class="dialog-message"></p>
            <div class="dialog-input">
                <div class="dialog-input-label"></div>
                <textarea class="dialog-input-text" rows="3" maxlength="1024"></textarea>
            </div>
            <div class="dialog-buttons"></div>
        </form>
    </dialog>

    <script src="js/lib/xlsx.full.min.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
